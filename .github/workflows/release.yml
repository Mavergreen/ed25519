name: release

# Builds Universal ed25519 tools (x86_64@10.9 + arm64@11) on an Apple-Silicon runner and
# ships a double-clickable .pkg + tarball. Entry points:
#   - push to main: if the pinned orlp/ed25519 commit's date has no release yet -> cut
#     v<date>-mavericks.1. Otherwise build only (CI smoke), no release.
#   - workflow_dispatch (local_release=true): cut the next v<date>-mavericks.(N+1).
#   - v* tag: publish that exact version.

on:
  push:
    branches: [main]
    tags: ['*-mavericks.*']
  pull_request:
    branches: [main]          # PR build is the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a local -mavericks.(N+1) release for the current pinned commit"
        type: boolean
        default: false

permissions:
  contents: write

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a *-mavericks.* tag, a workflow_dispatch) is keyed per RUN and is
# therefore alone in its group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main HERE CAN PUBLISH (an upstream with no release yet auto-cuts -mavericks.1), and
# concurrency is resolved when a run is queued -- before the ver step decides whether this one
# releases -- so cancelling the run would cancel the publish job with it.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26   # Apple Silicon; cross-builds the x86_64/10.9 slice. Use macos-15 if 26 is unavailable.
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # version.sh needs the full tag history

      - name: Install mavericks-shipyard
        uses: ModernMavericks/shipyard/.github/actions/install@v1  # mavericks-shipyard

      - name: Verify shipyard installed
        run: |
          [ -d "$SHIPYARD_SCRIPTS" ] || { echo "::error::SHIPYARD_SCRIPTS not set by install@v1"; exit 1; }
          echo "shipyard scripts: $SHIPYARD_SCRIPTS"

      # The shared runner takes the whole top-level suite, so a newly added test runs the day it lands
      # rather than when someone remembers to add a CI line.
      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh"

      - name: Fetch upstream + derive the date-based version
        id: ver
        run: |
          set -eu
          src="$(sh build/fetch-ed25519.sh)"
          sh build/derive-upstream-version.sh "$src"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            full="$GITHUB_REF_NAME"; tag="$GITHUB_REF_NAME"; rel=yes
          else
            mode=auto
            if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
              mode=local
            fi
            out="$(sh build/version.sh "$mode")"
            full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
            tag="$(printf '%s\n' "$out"  | sed -n 's/^TAG=//p')"
            rel="$(printf '%s\n' "$out"  | sed -n 's/^RELEASE=//p')"
            # only main (push or workflow_dispatch) cuts a release; PRs and non-main branches never publish
            if [ "$GITHUB_REF_NAME" != main ]; then rel=no; fi
          fi
          printf '%s\n' "$full" > VERSION
          { echo "full=$full"; echo "tag=$tag"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full tag=$tag release=$rel"

      - name: Build the Universal tools
        run: sh build/build-tools.sh

      - name: Package the .pkg + tarball
        run: VERSION="${{ steps.ver.outputs.full }}" STAGE="build/stage" sh build/package-pkg.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          V="${{ steps.ver.outputs.full }}"
          cp "build/out/ed25519-${V}.pkg" dist/
          # The body travels IN the artifact: publish-release.yml does not check out the repo, and it
          # refuses an empty body. This repo keeps no release-notes/ dir (it ships a signing tool with
          # no updater and no Sparkle feed to describe), so generate a minimal one rather than publish
          # commit-derived notes nobody wrote. No SHA256SUMS here -- the workflow regenerates it.
          printf '## ed25519 %s\n\nThe ed25519-sign / ed25519-keygen tools the ModernMavericks family signs releases with, built for OS X 10.9 (x86_64 + arm64).\n' "$V" > dist/RELEASE_NOTES.md
          # A new upstream links what changed upstream (build/upstream-release-notes-url.sh says where);
          # a repackage gets nothing. Notes are prose: never fail the release over it.
          UPSEC="$(sh "$SHIPYARD_SCRIPTS/upstream-notes.sh" "$V" || true)"
          [ -z "$UPSEC" ] || printf '\n%s\n' "$UPSEC" >> dist/RELEASE_NOTES.md

      # Conformance: do the artifacts about to be published agree with each other and with the
      # family's schemes? Gated like the signing step: this is a question about a release rather than
      # about a build, and a non-publishing build has not produced the things it would compare.
      - name: Artifact conformance
        if: steps.ver.outputs.release == 'yes'
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "${{ steps.ver.outputs.full }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: mavericks-ed25519
          path: dist/*

  publish:
    if: needs.build.outputs.publish == 'yes'
    needs: [build]
    permissions:
      contents: write
    uses: ModernMavericks/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.version }}
      artifact: mavericks-ed25519
