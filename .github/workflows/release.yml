name: release

# Builds the ed25519 tools on Linux with clang22: for x86_64 Linux (a tarball) and, cross, as Universal
# Mach-O (x86_64@10.9 + arm64@11.0) in a double-clickable .pkg. Entry points:
#   - push to main: if the pinned orlp/ed25519 commit's date has no release yet -> cut
#     <date>-mavericks.1. Otherwise build only (CI smoke), no release. Other branches build only.
#   - workflow_dispatch (local_release=true): cut the next <date>-mavericks.(N+1).
#   - workflow_dispatch (reconcile=true): the same, only while no release carries this declared state.

on:
  push:
    branches-ignore: ['renovate/**']
  pull_request:
    branches: [main]          # PR build is the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a local -mavericks.(N+1) release for the current pinned commit"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

# Only a pull_request supersedes -- keyed per ref, so a force-push replaces its own predecessor.
# Everything else (a branch push, a workflow_dispatch) is keyed per RUN and is therefore alone in its
# group: never queued, never evicted, never cancelled.
#
# cancel-in-progress:false was never the protection it looked like: it protects the RUNNING job and
# not the QUEUED one -- GitHub keeps only the newest pending run per group and cancels the rest -- so
# the old shared group discarded runs silently. golang lost one on 2026-09-09, 13 seconds after the
# run that evicted it.
#
# A push to main HERE CAN PUBLISH (an upstream with no release yet auto-cuts -mavericks.1), and
# concurrency is resolved when a run is queued -- before the ver job decides whether this one
# releases -- so cancelling the run would cancel the publish job with it.
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request'
                && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.full }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # version.sh needs the full tag history
          persist-credentials: false

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Fetch upstream + derive the date-based version and the publish decision
        id: ver
        env:
          LOCAL_RELEASE: ${{ inputs.local_release }}
          RECONCILE: ${{ inputs.reconcile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          src="$(sh build/fetch-ed25519.sh)"
          sh build/derive-upstream-version.sh "$src"
          effective_local_release="$LOCAL_RELEASE"
          if [ "$RECONCILE" = true ]; then effective_local_release=true; fi
          mode="$(LOCAL_RELEASE="$effective_local_release" sh "$SHIPYARD_SCRIPTS/release-mode.sh")"
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          tag="$(printf '%s\n' "$out"  | sed -n 's/^TAG=//p')"
          rel="$(printf '%s\n' "$out"  | sed -n 's/^RELEASE=//p')"
          [ -n "$full" ] || { echo "::error::no version derived"; exit 1; }
          # only main (push or workflow_dispatch) cuts a release; PRs and other branches never publish
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/main|workflow_dispatch:refs/heads/main) : ;;
            *) rel=no ;;
          esac
          # A reconcile dispatch publishes only while no release carries this declared state; a human's
          # local_release=true stays ungated, since choosing it is the decision to publish.
          if [ "$rel" = yes ] && [ "$RECONCILE" = true ]; then
            digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
            answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full")"
            echo "release-needed: $answer"
            [ "$answer" = PUBLISH ] || rel=no
          fi
          { echo "full=$full"; echo "tag=$tag"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full tag=$tag release=$rel"

  build:
    needs: ver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # release-notes.sh reads the tags
          persist-credentials: false

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Build out of tree
        run: |
          echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
          echo "DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"

      - name: The pkg test reads its payload with cpio
        run: command -v cpio || { sudo apt-get update -qq && sudo apt-get install -y -qq cpio; }

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Pin the version the ver job resolved, and fetch upstream
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: |
          set -eu
          printf '%s\n' "$VER" > VERSION
          sh build/derive-upstream-version.sh "$(sh build/fetch-ed25519.sh)"

      - name: Build the Linux tools and package the tarball
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: |
          set -eu
          bin="$(sh build/build-tools-linux.sh)"
          tarball="$(VERSION="$VER" OUT="$DIST" sh build/package-tar.sh "$bin")"
          x="$RUNNER_TEMP/tarball/ed25519"
          mkdir -p "$(dirname "$x")"
          python3 "$SHIPYARD_SCRIPTS/product-tar.py" "$tarball" ed25519 "$(sha256sum < "$tarball" | cut -c1-64)" "$x"
          { echo "TARBALL=$tarball"; echo "TARBALL_BIN=$x/bin"; } >> "$GITHUB_ENV"

      - name: Build the Universal tools
        run: sh build/build-tools.sh

      - name: Package the .pkg
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: |
          set -eu
          pkg="$(VERSION="$VER" sh build/package-pkg.sh)"
          cp "$pkg" "$DIST/"

      - name: Every host-agnostic suite runs, the tools' against the tarball's, and none skips
        run: BIN="$TARBALL_BIN" sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" --strict-host

      - name: Ingredient pins are well declared
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"

      # The body travels IN the artifact: publish-release.yml does not check out the repo, and it
      # refuses an empty body. This repo has no Sparkle updater or feed, so the Release body is the
      # notes file's only consumer. No SHA256SUMS here -- the workflow regenerates it.
      - name: Release notes, with the declared state recorded
        env:
          VER: ${{ needs.ver.outputs.version }}
          TAG: ${{ needs.ver.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$TAG" --version "$VER" \
            --product ed25519 --min-os 10.9.5 --out "$DIST/RELEASE_NOTES.md"
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file "$DIST/RELEASE_NOTES.md" --digest "$digest"

      - name: Artifact conformance
        env:
          VER: ${{ needs.ver.outputs.version }}
        run: |
          set -eu
          CL="$(sh build/fetch-clang22.sh)"
          export LIPO="$CL/bin/llvm-lipo" OTOOL="$CL/bin/llvm-otool"
          facts="$(sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$DIST" "$VER")"
          printf '%s\n' "$facts" | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: mavericks-ed25519
          if-no-files-found: error
          path: |
            ${{ env.DIST }}/*.pkg
            ${{ env.DIST }}/*.tar.gz
            ${{ env.DIST }}/RELEASE_NOTES.md

  # This run's own pkg, installed on Mac OS X 10.9 and run there. A same-repo PR's head already ran here
  # on its branch push, so its pull_request run skips this job and modern-smoke; a fork's PR and a
  # Renovate PR, whose branch push release.yml does not build, run them.
  vm-test:
    needs: [ver, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with: { name: mavericks-ed25519, path: dist }
      - name: Install the pkg on Mac OS X 10.9 and sign and verify with what it installed
        uses: Mavergreen/mavericks-vm@v1
        env:
          ED25519_VERSION_UNDER_TEST: ${{ needs.ver.outputs.version }}
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          envs: ED25519_VERSION_UNDER_TEST
          copyback: false
          run: |
            set -eu
            sw_vers
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            sudo installer -pkg "dist/ed25519-$ED25519_VERSION_UNDER_TEST.pkg" -target /
            /usr/local/bin/mavergreen check
            rc=0
            sh tests/installed-smoke.sh || rc=$?
            [ "$rc" -eq 0 ] || { echo "installed-smoke.sh exited $rc (77, a skip, is a failure here)"; exit 1; }

  # The arm64 slice, installed and run on current macOS: the one job this repo runs on a macOS runner.
  modern-smoke:
    needs: [ver, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'renovate/')
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with: { name: mavericks-ed25519, path: dist }
      - name: Install the pkg, and sign and verify with its arm64 slice
        env:
          ED25519_VERSION_UNDER_TEST: ${{ needs.ver.outputs.version }}
        run: |
          set -eu
          [ "$(uname -m)" = arm64 ] && [ "$(arch)" = arm64 ] || { echo "::error::this runner is not running arm64 natively"; exit 1; }
          sudo installer -pkg "dist/ed25519-$ED25519_VERSION_UNDER_TEST.pkg" -target /
          /usr/local/bin/mavergreen check
          rc=0
          sh tests/installed-smoke.sh || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::installed-smoke.sh exited $rc (77, a skip, is a failure here)"; exit 1; }

  publish:
    needs: [ver, build, vm-test, modern-smoke]
    if: needs.ver.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.ver.outputs.version }}
      artifact: mavericks-ed25519

  retry:
    needs: [ver, publish]
    if: always() && needs.publish.result == 'failure'
    permissions: { contents: read, actions: write }
    uses: Mavergreen/shipyard/.github/workflows/retry-release.yml@v1
    with: { version: "${{ needs.ver.outputs.version }}" }

  required:
    name: required (release)
    if: always()
    needs: [ver, build, vm-test, modern-smoke, publish, retry]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
